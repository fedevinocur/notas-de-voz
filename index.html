<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Notas de voz</title>
<meta name="description" content="Dictá y guardá notas de voz transcriptas.">
<!-- Seguridad: la página solo puede cargar sus propios archivos y hablar con la API de Anthropic.
     Nada de scripts o estilos en línea, ni de otros sitios. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.anthropic.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<!-- Es una herramienta personal: que los buscadores no la listen. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f0eee8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/league-spartan-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>

<!-- El borde suave de un título filmado, igual que en la web: un desenfoque llevado de vuelta a forma dura. -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="title-soft" x="-2%" y="-6%" width="104%" height="112%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="0.6"/>
    <feComponentTransfer><feFuncA type="linear" slope="4" intercept="-1.32"/></feComponentTransfer>
  </filter>
</svg>

<section id="view-list" class="view">
  <header class="top">
    <h1 class="title"><span>Notas</span></h1>
    <button id="btn-theme" class="icon-btn" aria-label="Cambiar entre modo claro y oscuro">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
    <button id="btn-menu" class="icon-btn" aria-label="Más opciones" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="12" cy="19" r="1.1"/></svg>
    </button>
    <div id="menu" class="menu" hidden>
      <div class="menu-title">Idioma del dictado</div>
      <div id="menu-langs"></div>
      <hr>
      <button id="btn-ai">Puntuación con IA</button>
      <button id="btn-folder">Guardar en carpeta</button>
      <hr>
      <button id="btn-export">Exportar copia</button>
      <button id="btn-import">Importar copia</button>
    </div>
  </header>

  <button id="folder-banner" class="banner" hidden>Carpeta desconectada · Tocá para reconectar</button>

  <label class="search" id="search-box" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="search" type="search" placeholder="Buscar" autocomplete="off" enterkeyhint="search" aria-label="Buscar en las notas">
  </label>

  <div id="filters" class="filters" hidden></div>

  <main id="list"></main>

  <div id="empty" class="empty" hidden>
    <p class="empty-title"><span>Sin notas</span></p>
    <p>Tocá el micrófono y empezá a hablar.</p>
  </div>
  <div id="no-results" class="empty" hidden>
    <p>Ninguna nota coincide con la búsqueda.</p>
  </div>
</section>

<section id="view-note" class="view" hidden>
  <header class="top">
    <button id="btn-back" class="back" aria-label="Volver a las notas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg><span>Volver</span>
    </button>
    <div class="note-actions">
      <button id="btn-copy" class="icon-btn" aria-label="Copiar el texto">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"/></svg>
      </button>
      <button id="btn-share" class="icon-btn" aria-label="Enviar a otra app">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 18 6M9 6h9v9"/></svg>
      </button>
      <button id="btn-delete" class="icon-btn" aria-label="Eliminar la nota">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.8 12.5h9.4L17.5 7"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="note-date" class="note-date"></div>
    <div class="tools">
      <button id="btn-label" class="tool" aria-haspopup="dialog"></button>
      <button id="btn-punct" class="tool">Puntuar</button>
    </div>
    <textarea id="editor" rows="1" placeholder="Tocá el micrófono o escribí" aria-label="Texto de la nota"></textarea>
    <div id="live" class="live" aria-live="polite" hidden><span id="live-final"></span><span id="live-interim"></span><span id="live-tail"></span></div>
  </main>
</section>

<div class="dock">
  <div class="dock-side">
    <div id="rec" class="rec" hidden><span class="rec-dot"></span><span>Rec</span><span id="rec-time">00:00</span></div>
  </div>
  <button id="btn-mic" class="mic" aria-label="Dictar una nota nueva">
    <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
    <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10"/></svg>
  </button>
  <div class="dock-side dock-right">
    <div id="rec-langs" class="langs" role="radiogroup" aria-label="Idioma del dictado"></div>
  </div>
</div>

<div id="backdrop" class="backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-labelledby="sheet-title" hidden>
  <div id="sheet-title" class="sheet-title"></div>
  <div id="sheet-rows"></div>
</div>

<div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" hidden></button></div>
<input id="file-import" type="file" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
